name: Tests

on:
    push:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    tests:
        name: Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Node.js v20
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install dependencies
              run: npm install

            - name: Run Eslint
              run: npm run lint

            # The unit tests need no WhatsApp session. The rest of tests/ does
            # (tests/helper.js throws without WWEBJS_TEST_REMOTE_ID), so only
            # tests/unit can run here.
            - name: Run unit tests
              run: npx mocha tests/unit --recursive --timeout 5000
